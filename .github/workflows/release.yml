# A tag v<version> builds the extension, checks it, and publishes a GitHub
# release with the files scripts/package.mjs makes. With the AMO API key in
# the repository secrets (AMO_JWT_ISSUER, AMO_JWT_SECRET) the Firefox build is
# also signed by Mozilla as an unlisted add-on, and the signed .xpi, which a
# release Firefox installs for good, is attached too.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The tag names the version package.json has
        run: |
          set -euo pipefail
          want="v$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME, package.json says $want"; exit 1; }

      - run: npm ci

      - name: Check and package
        run: npm run package

      - name: Lint the Firefox build as addons.mozilla.org does
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --warnings-as-errors

      - name: Sign the Firefox build (unlisted), when the AMO key is set
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_EXT_API_KEY}" ]; then echo "no AMO key: the Firefox build stays unsigned"; exit 0; fi
          npx --yes web-ext@8 sign --source-dir dist/firefox --channel unlisted --artifacts-dir dist/signed
          v="$(node -p 'require("./package.json").version')"
          cp dist/signed/*.xpi "dist/release/hbs2-hub-${v}-firefox.xpi"

      - name: Checksums
        run: cd dist/release && sha256sum -- ./* > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/release/* --title "hbs2-hub $GITHUB_REF_NAME" \
            --notes "Install: see the README. Needs hbs2-hub 0.26.0.2 or later, with \`hbs2-hub native-host --install\`."
